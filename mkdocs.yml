site_name: Blender Gala
site_description: Structural biology visualization tools for Blender
site_url: https://blender-gala.github.io/blender_gala/
repo_url: https://github.com/blender-gala/blender_gala
repo_name: blender-gala/blender_gala
edit_uri: edit/main/docs/

# Emit `guide/page.html` rather than `guide/page/index.html`. Clean URLs need a
# server to resolve a directory to its index, so with the default the built
# site is unusable when opened straight off disk with file:// — every internal
# link lands on a folder listing. This costs a `.html` suffix on the published
# URLs and makes `site/` browsable without a server.
use_directory_urls: false

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Guide:
      - Getting started: guide/getting-started.md
      - Selection language: guide/selections.md
      - Publication scenes: guide/scenes.md
      - Interactions: guide/interactions.md
      - Measurement and labels: guide/measurement.md
      - Colouring by data: guide/colouring.md
      - Compositing and passes: guide/compositing.md
      - The Blender UI: guide/ui.md
  - Vignettes: vignettes.md
  - API reference:
      - Overview: api/index.md
      - Scene: api/scene.md
      - Interactions: api/interactions.md
      - Measure: api/measure.md
      - Annotate: api/annotate.md
      - Colour: api/colour.md
      - Core: api/core.md
  - Design decisions: design.md
  - Contributing: contributing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 3
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/blender-gala/blender_gala

watch:
  - blender_gala
