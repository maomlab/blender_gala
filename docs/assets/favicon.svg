<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Blender Gala">
  <title>Blender Gala</title>
  <!-- A G whose stroke is a chain, with atoms at its two ends. Drawn on a 64
       unit grid with an 8 unit stroke, which is what keeps it readable at the
       16 px a browser tab gives it. -->
  <path d="M45 19 A18 18 0 1 0 45 45 L45 34 L33 34"
        fill="none" stroke="#00897b" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="45" cy="19" r="6.5" fill="#00564c"/>
  <circle cx="33" cy="34" r="6" fill="#ff7043"/>
</svg>
