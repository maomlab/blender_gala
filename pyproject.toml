[project]
name = "blender-gala"
# Read from blender_manifest.toml rather than restated here. Blender requires
# a literal version in the manifest, `blender_gala.__version__` reads it at
# runtime, and the Makefile reads it for `make help` — so the manifest is the
# one place it can live, and a copy here would be a second place to forget.
dynamic = ["version"]
description = "Tools to support using Blender for structural biology visualization and exploration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Matthew O'Meara", email = "maom@umich.edu" }]
keywords = ["blender", "structural-biology", "molecular-nodes", "visualization"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

# Runtime dependencies are supplied by Blender and Molecular Nodes; nothing is
# vendored. This block exists so the modules that do not import bpy can be
# exercised under a system interpreter.
dependencies = []

[project.optional-dependencies]
# The three tools that decide whether CI is green are pinned exactly, and the
# rest are floors. A linter, a type checker and a set of type stubs are not
# ordinary dependencies: they gate the build on *their* opinion, so a new
# release of any of them turns CI red with no commit on this repository —
# which is precisely what a stub change to `evaluated_depsgraph_get` did.
# Pinned, that failure arrives when someone bumps the number here and can look
# at it, rather than on an unrelated pull request at an unrelated moment.
#
# Bump them deliberately: raise the pin, run `make lint typecheck`, and fix
# what the new version has found in the same commit.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.16.2",
    "mypy==2.3.0",
    "fake-bpy-module==20260809",
    # scripts/capture_ui.py crops the panel screenshots outside Blender.
    "pillow>=10.0",
    "numpy>=1.24",
]
# The electrostatics vignette shells out to these two. They are not runtime
# dependencies of the add-on — Gala finds them on PATH, the way the PyMOL
# plugin does — but installing them here keeps a checkout self-contained.
# `apbs-binary` is the upstream APBS 3.4.1 build repackaged as a wheel
# (deargen/py-apbs-binary, Apache-2.0); `pdb2pqr` is the real thing.
apbs = [
    "apbs-binary==3.4.1.1",
    "pdb2pqr==3.7.1",
]
# Pinned for the same reason as the `dev` tools, and with one addition: the
# site is built with `--strict`, so a warning a new release decides to emit is
# a failed build. `mkdocs-material` is already announcing breaking changes for
# MkDocs 2.0, which is exactly the kind of thing that should arrive on a commit
# that raises this pin rather than on an unrelated pull request.
#
# `mkdocstrings-python` is pinned separately from `mkdocstrings[python]`: the
# handler is the thing that renders the API reference, it releases on its own
# schedule, and the extra only asks for "some version of it".
#
# These are the four top-level packages. Their own dependencies float, which is
# the usual bargain — a lock file is the next step if that ever bites.
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "mkdocstrings==1.0.6",
    "mkdocstrings-python==2.0.5",
    # Not a mistake, and not only for linting: `separate_signature` asks
    # mkdocstrings to lay a signature out over several lines, and it needs
    # Black or Ruff installed to do it. Without one, it says so at INFO level
    # and quietly renders `publication_setup`'s seventeen parameters as a
    # single unbroken line. The lint job had ruff and the docs job did not, so
    # the site was published with the unreadable version while every local
    # build looked right.
    "ruff==0.16.2",
]

[project.urls]
Homepage = "https://github.com/maomlab/blender_gala"
Documentation = "https://maomlab.github.io/blender_gala"
Source = "https://github.com/maomlab/blender_gala"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "blender_gala/blender_manifest.toml"
pattern = '^version\s*=\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["blender_gala"]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".blender-deps", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function call in default argument (bpy idioms)
    "RUF012", # bpy annotations on class attributes are not ClassVar

]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"vignettes/*" = ["E402"]
# The package __init__ drops stale submodules before importing them, which by
# construction happens between the stdlib imports and the package ones. See
# `_drop_stale_submodules`: doing it any later is doing it too late.
"blender_gala/__init__.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["blender_gala"]

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["blender_gala"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disable_error_code = ["annotation-unchecked", "var-annotated"]

[[tool.mypy.overrides]]
module = ["bpy.*", "bmesh.*", "mathutils.*", "biotite.*", "scipy.*", "databpy.*"]
ignore_missing_imports = true

# The Blender-facing layer cannot be typed cleanly against the community bpy
# stubs: `prop: EnumProperty(...)` is the annotation form Blender requires but
# is not a valid type expression, `self.layout` is Optional in the stubs but
# never None inside `draw`, and `Operator.execute` is declared with a Literal
# return set. None of these are defects in the code, so the noise is scoped
# here rather than blanket-disabled across the package.
[[tool.mypy.overrides]]
module = ["blender_gala.ui.*", "blender_gala.ops.*"]
disable_error_code = ["valid-type", "union-attr", "attr-defined", "override", "misc"]

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "bpy: test requires a running Blender interpreter",
    "mn: test requires Molecular Nodes to be installed",
]
filterwarnings = ["ignore::DeprecationWarning"]
