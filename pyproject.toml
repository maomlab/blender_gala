[project]
name = "blender-gala"
version = "0.1.0"
description = "Tools to support using Blender for structural biology visualization and exploration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Blender Gala contributors" }]
keywords = ["blender", "structural-biology", "molecular-nodes", "visualization"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

# Runtime dependencies are supplied by Blender and Molecular Nodes; nothing is
# vendored. This block exists so the modules that do not import bpy can be
# exercised under a system interpreter.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "fake-bpy-module>=20240604",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.urls]
Homepage = "https://github.com/maomlab/blender_gala"
Documentation = "https://maomlab.github.io/blender_gala"
Source = "https://github.com/maomlab/blender_gala"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blender_gala"]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".blender-deps", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function call in default argument (bpy idioms)
    "RUF012", # bpy annotations on class attributes are not ClassVar

]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"vignettes/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["blender_gala"]

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["blender_gala"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disable_error_code = ["annotation-unchecked", "var-annotated"]

[[tool.mypy.overrides]]
module = ["bpy.*", "bmesh.*", "mathutils.*", "biotite.*", "scipy.*", "databpy.*"]
ignore_missing_imports = true

# The Blender-facing layer cannot be typed cleanly against the community bpy
# stubs: `prop: EnumProperty(...)` is the annotation form Blender requires but
# is not a valid type expression, `self.layout` is Optional in the stubs but
# never None inside `draw`, and `Operator.execute` is declared with a Literal
# return set. None of these are defects in the code, so the noise is scoped
# here rather than blanket-disabled across the package.
[[tool.mypy.overrides]]
module = ["blender_gala.ui.*", "blender_gala.ops.*"]
disable_error_code = ["valid-type", "union-attr", "attr-defined", "override", "misc"]

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "bpy: test requires a running Blender interpreter",
    "mn: test requires Molecular Nodes to be installed",
]
filterwarnings = ["ignore::DeprecationWarning"]
