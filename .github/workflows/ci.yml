name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # From the `dev` extra rather than a list repeated here, so the versions
      # CI lints with are the versions `make dev` installs. Two copies of a
      # toolchain drift, and the one that drifts is always the one nobody is
      # looking at.
      - name: Install the toolchain
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check blender_gala tests vignettes scripts
          ruff format --check blender_gala tests vignettes scripts

      - name: Type check
        run: mypy blender_gala

      - name: Fixtures are reproducible
        run: |
          python tests/data/make_fixtures.py
          git diff --exit-code tests/data

  test:
    name: Test on Blender ${{ matrix.blender }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release and the current one. 5.1 is the floor
        # because Molecular Nodes 4.5 requires it, and Gala needs 4.5 for the
        # whole feature set.
        blender: ["5.1.2", "5.2.0"]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ matrix.blender }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SERIES="$(echo '${{ matrix.blender }}' | cut -d. -f1,2)"
          URL="https://download.blender.org/release/Blender${SERIES}/blender-${{ matrix.blender }}-linux-x64.tar.xz"
          echo "Fetching $URL"
          curl -fSL "$URL" -o blender.tar.xz
          mkdir -p ~/blender
          tar -xf blender.tar.xz -C ~/blender --strip-components=1

      # libegl1 and its Mesa driver are what let Blender make a GPU context
      # with no display. Without them it prints "Couldn't open libEGL.so.1"
      # and aborts as soon as anything renders — Blender 5 runs the compositor
      # on the GPU even when Cycles is on the CPU.
      - name: System libraries Blender needs headlessly
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 \
            libgl1 libsm6 libegl1 libegl-mesa0

      # --online-mode is required: Blender refuses to reach the extensions
      # repository without it, package_install fails its poll, and nothing is
      # installed. Blender also exits 0 when a --python-expr raises,
      # so neither the `||` below nor the exit code can be trusted — the check
      # afterwards is what actually tells us whether it worked.
      - name: Install Molecular Nodes
        run: |
          ~/blender/blender --background --online-mode --python-expr "
          import bpy
          bpy.ops.extensions.repo_sync(repo_index=0)
          bpy.ops.extensions.package_install(repo_index=0, pkg_id='molecularnodes')
          bpy.ops.wm.save_userpref()
          " || true
          ~/blender/blender --background --python-expr "
          try:
              import bl_ext.blender_org.molecularnodes  # noqa: F401
          except Exception as exc:
              print(f'::warning::Molecular Nodes did not install ({exc}); its tests will skip.')
          "

      - name: Install test dependencies
        run: ~/blender/blender --background --factory-startup --python scripts/install_deps.py

      - name: Run the test suite
        run: ~/blender/blender --background --python tests/run_tests.py -- -v --no-header

      - name: Validate the extension manifest
        run: ~/blender/blender --command extension validate blender_gala

      - name: Build the extension
        run: |
          mkdir -p dist
          ~/blender/blender --command extension build \
            --source-dir blender_gala --output-dir dist

      - name: Upload the extension
        if: matrix.blender == '5.2.0'
        uses: actions/upload-artifact@v4
        with:
          name: blender-gala-extension
          path: dist/*.zip

  vignettes:
    name: Run the vignettes
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-5.2.0-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          curl -fSL https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz -o blender.tar.xz
          mkdir -p ~/blender
          tar -xf blender.tar.xz -C ~/blender --strip-components=1

      # libegl1 and its Mesa driver are what let Blender make a GPU context
      # with no display. Without them it prints "Couldn't open libEGL.so.1"
      # and aborts as soon as anything renders — Blender 5 runs the compositor
      # on the GPU even when Cycles is on the CPU.
      - name: System libraries Blender needs headlessly
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 \
            libgl1 libsm6 libegl1 libegl-mesa0

      # As in the test job, but fatal: a vignette cannot run without Molecular
      # Nodes, so there is nothing to be gained by discovering that one script
      # at a time.
      - name: Install Molecular Nodes
        run: |
          ~/blender/blender --background --online-mode --python-expr "
          import bpy
          bpy.ops.extensions.repo_sync(repo_index=0)
          bpy.ops.extensions.package_install(repo_index=0, pkg_id='molecularnodes')
          bpy.ops.wm.save_userpref()
          " || true
          ~/blender/blender --background --python-expr "
          import sys
          try:
              import bl_ext.blender_org.molecularnodes  # noqa: F401
          except Exception as exc:
              sys.exit(f'Molecular Nodes did not install: {exc}')
          "

      # The electrostatics vignette shells out to these. Both are wheels, so
      # this is a pip install rather than a system package; APBS needs its own
      # bundled lib/ on the loader path, which is what the wrapper is for.
      - name: Install APBS and PDB2PQR
        run: |
          set -euo pipefail
          python -m pip install --upgrade apbs-binary pdb2pqr
          package=$(python -c "import apbs_binary, os; print(os.path.dirname(apbs_binary.__file__))")
          mkdir -p ~/.local/bin
          printf '#!/bin/sh\nexport LD_LIBRARY_PATH="%s/lib:$LD_LIBRARY_PATH"\nexec "%s/bin/apbs" "$@"\n' \
            "$package" "$package" > ~/.local/bin/apbs
          chmod +x ~/.local/bin/apbs
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: The external programs are there
        run: |
          apbs --version | head -1
          pdb2pqr --version 2>&1 | tail -1

      # A tutorial that has drifted from the code is worse than no tutorial
      # (SPECIFICATION D-22), so every vignette is executed here. Only the
      # numbered scripts: `_common.py` is the shared helper module.
      - name: Execute every vignette
        run: |
          set -euo pipefail
          for script in vignettes/[0-9]*.py; do
            echo "::group::$script"
            ~/blender/blender --background --python "$script"
            echo "::endgroup::"
          done

      - name: Upload the rendered images
        uses: actions/upload-artifact@v4
        with:
          name: vignette-images
          path: docs/images/

  docs:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # From the `docs` extra, for the same reason the lint job installs the
      # `dev` one: one place to bump, and no second copy to drift.
      - name: Install the docs toolchain
        run: python -m pip install -e ".[docs]"

      - name: Build
        run: mkdocs build --strict

      # Clean URLs pointing at directories look fine under `mkdocs serve` and
      # break the moment the site is opened from disk, so check the built
      # output the way a reader sees it.
      - name: Check internal links
        run: python scripts/check_links.py
