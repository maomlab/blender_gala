name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the toolchain
        run: python -m pip install --upgrade "ruff>=0.6" "mypy>=1.11" fake-bpy-module numpy

      - name: Lint
        run: |
          ruff check blender_gala tests vignettes scripts
          ruff format --check blender_gala tests vignettes scripts

      - name: Type check
        run: mypy blender_gala

      - name: Fixtures are reproducible
        run: |
          python tests/data/make_fixtures.py
          git diff --exit-code tests/data

  test:
    name: Test on Blender ${{ matrix.blender }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release and the current one. Blender 5 rewrote
        # the compositor, so both need to pass for the version shims to mean
        # anything.
        blender: ["4.2.11", "5.2.0"]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ matrix.blender }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SERIES="$(echo '${{ matrix.blender }}' | cut -d. -f1,2)"
          URL="https://download.blender.org/release/Blender${SERIES}/blender-${{ matrix.blender }}-linux-x64.tar.xz"
          echo "Fetching $URL"
          curl -fSL "$URL" -o blender.tar.xz
          mkdir -p ~/blender
          tar -xf blender.tar.xz -C ~/blender --strip-components=1

      - name: System libraries Blender needs headlessly
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6

      - name: Install Molecular Nodes
        run: |
          ~/blender/blender --background --python-expr "
          import bpy
          bpy.ops.extensions.repo_sync(repo_index=0)
          bpy.ops.extensions.package_install(repo_index=0, pkg_id='molecularnodes')
          bpy.ops.wm.save_userpref()
          " || echo 'Molecular Nodes install failed; MN-dependent tests will skip.'

      - name: Install test dependencies
        run: ~/blender/blender --background --factory-startup --python scripts/install_deps.py

      - name: Run the test suite
        run: ~/blender/blender --background --python tests/run_tests.py -- -v --no-header

      - name: Validate the extension manifest
        run: ~/blender/blender --command extension validate blender_gala

      - name: Build the extension
        run: |
          mkdir -p dist
          ~/blender/blender --command extension build \
            --source-dir blender_gala --output-dir dist

      - name: Upload the extension
        if: matrix.blender == '5.2.0'
        uses: actions/upload-artifact@v4
        with:
          name: blender-gala-extension
          path: dist/*.zip

  vignettes:
    name: Run the vignettes
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-5.2.0-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          curl -fSL https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz -o blender.tar.xz
          mkdir -p ~/blender
          tar -xf blender.tar.xz -C ~/blender --strip-components=1

      - name: System libraries Blender needs headlessly
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6

      - name: Install Molecular Nodes
        run: |
          ~/blender/blender --background --python-expr "
          import bpy
          bpy.ops.extensions.repo_sync(repo_index=0)
          bpy.ops.extensions.package_install(repo_index=0, pkg_id='molecularnodes')
          bpy.ops.wm.save_userpref()
          "

      # A tutorial that has drifted from the code is worse than no tutorial
      # (SPECIFICATION D-22), so every vignette is executed here.
      - name: Execute every vignette
        run: |
          set -euo pipefail
          for script in vignettes/*.py; do
            echo "::group::$script"
            ~/blender/blender --background --python "$script"
            echo "::endgroup::"
          done

      - name: Upload the rendered images
        uses: actions/upload-artifact@v4
        with:
          name: vignette-images
          path: docs/images/

  docs:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the docs toolchain
        run: python -m pip install --upgrade mkdocs mkdocs-material "mkdocstrings[python]"

      - name: Build
        run: mkdocs build --strict
