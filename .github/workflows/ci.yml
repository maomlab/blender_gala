name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Molecular Nodes is the dependency most able to break this repository — it
# backs every test that touches a molecule and every vignette — and
# `package_install` takes whatever the extensions repository currently offers,
# so a release changes what CI runs against with nothing committed here.
#
# The platform's download URLs are content addressed: this hash *is* the
# version, and the bytes behind it cannot change. To move to a newer Molecular
# Nodes, take `archive_hash` for the linux-x64 build from
# https://extensions.blender.org/api/v1/extensions/?platform=linux-x64 and
# raise both of these together.
env:
  MN_VERSION: "4.5.13"
  MN_SHA256: "c83390ffd2fc219f49ea2d4f18198f18da8cbf9bb3d7ff1b69ae871d379f29cc"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      # From the `dev` extra rather than a list repeated here, so the versions
      # CI lints with are the versions `make dev` installs. Two copies of a
      # toolchain drift, and the one that drifts is always the one nobody is
      # looking at.
      - name: Install the toolchain
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check blender_gala tests vignettes scripts
          ruff format --check blender_gala tests vignettes scripts

      - name: Type check
        run: mypy blender_gala

      # A version bump that forgets CITATION.cff leaves the repository telling
      # people to cite a version that was never released.
      - name: CITATION.cff matches the manifest
        run: python scripts/make_citation.py --check

      - name: Fixtures are reproducible
        run: |
          python tests/data/make_fixtures.py
          git diff --exit-code tests/data

  test:
    name: Test on Blender ${{ matrix.blender }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release and the current one. 5.1 is the floor
        # because Molecular Nodes 4.5 requires it, and Gala needs 4.5 for the
        # whole feature set.
        blender: ["5.1.2", "5.2.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/blender
          key: blender-${{ matrix.blender }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SERIES="$(echo '${{ matrix.blender }}' | cut -d. -f1,2)"
          URL="https://download.blender.org/release/Blender${SERIES}/blender-${{ matrix.blender }}-linux-x64.tar.xz"
          echo "Fetching $URL"
          curl -fSL "$URL" -o blender.tar.xz
          mkdir -p ~/blender
          tar -xf blender.tar.xz -C ~/blender --strip-components=1

      # libegl1 and its Mesa driver are what let Blender make a GPU context
      # with no display. Without them it prints "Couldn't open libEGL.so.1"
      # and aborts as soon as anything renders — Blender 5 runs the compositor
      # on the GPU even when Cycles is on the CPU.
      - name: System libraries Blender needs headlessly
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 \
            libgl1 libsm6 libegl1 libegl-mesa0

      # Three things Blender does here can turn a failed install into a green
      # step, and all three had to be worked around:
      #
      #  * it refuses a relative filepath outright, hence `$PWD`;
      #  * it exits 0 when a `--python-expr` raises, so an uncaught exception is
      #    invisible to the shell however much `set -e` is in force;
      #  * `package_install_files` returns FINISHED even when extracting the
      #    archive failed — it reports the error and carries on — so its return
      #    value proves nothing.
      #
      # What does prove something is importing the thing afterwards, in the
      # same session, through the resolver the tests and vignettes use. Failure
      # goes out through `sys.exit`, which escapes where an exception does not.
      - name: Install Molecular Nodes ${{ env.MN_VERSION }}
        run: |
          set -euo pipefail
          curl -fSL "https://extensions.blender.org/download/sha256:${MN_SHA256}/add-on-molecularnodes-v${MN_VERSION}-linux-x64.zip" -o "$PWD/mn.zip"
          echo "${MN_SHA256}  $PWD/mn.zip" | sha256sum -c -
          ~/blender/blender --background --python-expr "
          import bpy, sys
          try:
              bpy.ops.extensions.package_install_files(
                  filepath='$PWD/mn.zip', repo='user_default', enable_on_install=True)
          except Exception as exc:
              sys.exit(f'Molecular Nodes did not install: {exc}')
          bpy.ops.wm.save_userpref()
          sys.path.insert(0, '$PWD')
          from blender_gala.core import mn
          try:
              print('Molecular Nodes:', mn.require_mn().__name__)
          except Exception as exc:
              sys.exit(f'Molecular Nodes did not install: {exc}')
          "

      # The install step already imported it; this checks that it survived
      # into a new process, which is what every step after this one depends on.
      # Through Gala's own resolver rather than a hard-coded module path: an
      # extension installed from a file lands under `bl_ext.user_default`
      # rather than `bl_ext.blender_org`, and `require_mn` is what the tests
      # and vignettes call anyway.
      - name: Molecular Nodes survived into a new session
        run: |
          ~/blender/blender --background --python-expr "
          import sys
          sys.path.insert(0, '.')
          try:
              from blender_gala.core import mn
              print('Molecular Nodes:', mn.require_mn().__name__)
          except Exception as exc:
              print(f'::warning::Molecular Nodes did not install ({exc}); its tests will skip.')
          "

      - name: Install test dependencies
        run: ~/blender/blender --background --factory-startup --python scripts/install_deps.py

      - name: Run the test suite
        run: ~/blender/blender --background --python tests/run_tests.py -- -v --no-header

      - name: Validate the extension manifest
        run: ~/blender/blender --command extension validate blender_gala

      - name: Build the extension
        run: |
          mkdir -p dist
          ~/blender/blender --command extension build \
            --source-dir blender_gala --output-dir dist

      - name: Upload the extension
        if: matrix.blender == '5.2.0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blender-gala-extension
          path: dist/*.zip

  vignettes:
    name: Run the vignettes
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/blender
          key: blender-5.2.0-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          curl -fSL https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz -o blender.tar.xz
          mkdir -p ~/blender
          tar -xf blender.tar.xz -C ~/blender --strip-components=1

      # libegl1 and its Mesa driver are what let Blender make a GPU context
      # with no display. Without them it prints "Couldn't open libEGL.so.1"
      # and aborts as soon as anything renders — Blender 5 runs the compositor
      # on the GPU even when Cycles is on the CPU.
      - name: System libraries Blender needs headlessly
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 \
            libgl1 libsm6 libegl1 libegl-mesa0

      # Three things Blender does here can turn a failed install into a green
      # step, and all three had to be worked around:
      #
      #  * it refuses a relative filepath outright, hence `$PWD`;
      #  * it exits 0 when a `--python-expr` raises, so an uncaught exception is
      #    invisible to the shell however much `set -e` is in force;
      #  * `package_install_files` returns FINISHED even when extracting the
      #    archive failed — it reports the error and carries on — so its return
      #    value proves nothing.
      #
      # What does prove something is importing the thing afterwards, in the
      # same session, through the resolver the tests and vignettes use. Failure
      # goes out through `sys.exit`, which escapes where an exception does not.
      - name: Install Molecular Nodes ${{ env.MN_VERSION }}
        run: |
          set -euo pipefail
          curl -fSL "https://extensions.blender.org/download/sha256:${MN_SHA256}/add-on-molecularnodes-v${MN_VERSION}-linux-x64.zip" -o "$PWD/mn.zip"
          echo "${MN_SHA256}  $PWD/mn.zip" | sha256sum -c -
          ~/blender/blender --background --python-expr "
          import bpy, sys
          try:
              bpy.ops.extensions.package_install_files(
                  filepath='$PWD/mn.zip', repo='user_default', enable_on_install=True)
          except Exception as exc:
              sys.exit(f'Molecular Nodes did not install: {exc}')
          bpy.ops.wm.save_userpref()
          sys.path.insert(0, '$PWD')
          from blender_gala.core import mn
          try:
              print('Molecular Nodes:', mn.require_mn().__name__)
          except Exception as exc:
              sys.exit(f'Molecular Nodes did not install: {exc}')
          "

      # As in the test job, but fatal: a vignette cannot run without Molecular
      # Nodes, so there is nothing to be gained by discovering that one script
      # at a time.
      - name: Molecular Nodes survived into a new session
        run: |
          ~/blender/blender --background --python-expr "
          import sys
          sys.path.insert(0, '.')
          try:
              from blender_gala.core import mn
              print('Molecular Nodes:', mn.require_mn().__name__)
          except Exception as exc:
              sys.exit(f'Molecular Nodes did not install: {exc}')
          "

      # The electrostatics vignette shells out to these. Both are wheels, so
      # this is a pip install rather than a system package; APBS needs its own
      # bundled lib/ on the loader path, which is what the wrapper is for.
      - name: Install APBS and PDB2PQR
        run: |
          set -euo pipefail
          python -m pip install -e ".[apbs]"
          package=$(python -c "import apbs_binary, os; print(os.path.dirname(apbs_binary.__file__))")
          mkdir -p ~/.local/bin
          printf '#!/bin/sh\nexport LD_LIBRARY_PATH="%s/lib:$LD_LIBRARY_PATH"\nexec "%s/bin/apbs" "$@"\n' \
            "$package" "$package" > ~/.local/bin/apbs
          chmod +x ~/.local/bin/apbs
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: The external programs are there
        run: |
          apbs --version | head -1
          pdb2pqr --version 2>&1 | tail -1

      # A tutorial that has drifted from the code is worse than no tutorial
      # (SPECIFICATION D-22), so every vignette is executed here. Only the
      # numbered scripts: `_common.py` is the shared helper module.
      - name: Execute every vignette
        run: |
          set -euo pipefail
          for script in vignettes/[0-9]*.py; do
            echo "::group::$script"
            ~/blender/blender --background --python "$script"
            echo "::endgroup::"
          done

      - name: Upload the rendered images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vignette-images
          path: docs/images/

  docs:
    name: Build the documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      # From the `docs` extra, for the same reason the lint job installs the
      # `dev` one: one place to bump, and no second copy to drift.
      - name: Install the docs toolchain
        run: python -m pip install -e ".[docs]"

      - name: Build
        run: mkdocs build --strict

      # Clean URLs pointing at directories look fine under `mkdocs serve` and
      # break the moment the site is opened from disk, so check the built
      # output the way a reader sees it.
      - name: Check internal links
        run: python scripts/check_links.py
