name: Release

# Tagging is the whole trigger: `git tag v0.2.0 && git push origin v0.2.0`
# builds the extension and publishes it as a GitHub release with the zip
# attached, which is what CONTRIBUTING has always claimed happens.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with the manifest produces a release whose
      # filename and contents say different versions, which is discovered by
      # whoever downloads it. Cheaper to fail here.
      - name: The tag matches the manifest
        run: |
          set -euo pipefail
          manifest=$(sed -n 's/^version *= *"\(.*\)"/\1/p' blender_gala/blender_manifest.toml)
          tag="${GITHUB_REF_NAME#v}"
          echo "manifest: $manifest    tag: $tag"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $manifest"
            exit 1
          fi

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-5.2.0-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          curl -fSL https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz -o blender.tar.xz
          mkdir -p ~/blender
          tar -xf blender.tar.xz -C ~/blender --strip-components=1

      # Blender will not start without these even with nothing to draw.
      - name: System libraries Blender needs headlessly
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 \
            libgl1 libsm6 libegl1 libegl-mesa0

      - name: Validate the manifest
        run: ~/blender/blender --command extension validate blender_gala

      - name: Build the extension
        run: |
          mkdir -p dist
          ~/blender/blender --command extension build \
            --source-dir blender_gala --output-dir dist
          ls -lh dist

      # The licence has to travel with the zip, not just sit in the repository.
      - name: The zip carries its licence
        run: |
          set -euo pipefail
          zip=$(ls dist/*.zip)
          unzip -l "$zip" | grep -q "LICENSE" \
            || { echo "::error::LICENSE is missing from $zip"; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Blender Gala $GITHUB_REF_NAME" \
            --generate-notes
