schema_version = "1.0.0"

id = "blender_gala"
version = "0.1.0"
name = "Blender Gala"
tagline = "Publication figures and measurements for structural biology"
maintainer = "Blender Gala contributors"
type = "add-on"

website = "https://github.com/maomlab/blender_gala"

tags = ["Render", "Scene", "Lighting", "Material"]

# Molecular Nodes 4.5 is what Gala is written against, and it requires Blender
# 5.1. Declaring the same floor here means Blender refuses to install Gala
# where it could not work fully, rather than leaving it to fail a feature at a
# time.
blender_version_min = "5.1.0"

license = ["SPDX:Apache-2.0"]
copyright = ["2026 Blender Gala contributors"]

[permissions]
files = "Read HDRI files; write rendered images and EXR passes"
